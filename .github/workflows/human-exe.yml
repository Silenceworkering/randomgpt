name: HUMAN.EXE
on:
  push:
    paths: ['human-exe/**', '.github/workflows/human-exe.yml']
  pull_request:
    paths: ['human-exe/**', '.github/workflows/human-exe.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human-exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: human-exe/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke test against production build
        run: TEST_URL=http://localhost:4173 npm run test:browser
