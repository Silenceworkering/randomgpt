# PAID hosting: review the Render estimate before approving creation.
# No free polling worker is available. Secrets are entered only in Render.
services:
  - type: worker
    name: dedlainych-bot
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    numInstances: 1
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: alembic upgrade head
    dockerCommand: python -m dedlainych
    maxShutdownDelaySeconds: 60
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: dedlainych-db
          property: connectionString
      - key: AI_PROVIDER
        value: rules
      - key: TZ
        value: Asia/Yakutsk
      - key: GROUP_CODE
        value: 6104-ОБ
      - key: INSTANCE_LOCK_WAIT_SECONDS
        value: "180"
      - key: MAX_FILE_BYTES
        value: "10485760"
databases:
  - name: dedlainych-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: dedlainych
    user: dedlainych
    diskSizeGB: 1
    ipAllowList: []
