# FREE only. PostgreSQL is external (Neon Free), not Render's expiring free database.
services:
  - type: web
    name: dedlainych-free
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RUN_MODE
        value: webhook
      - key: AI_PROVIDER
        value: rules
      - key: TZ
        value: Asia/Yakutsk
      - key: GROUP_CODE
        value: 6104-ОБ
      - key: MAX_FILE_BYTES
        value: "10485760"
