<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b10" />
    <meta
      name="description"
      content="VOLTRIX — подбор совместимых комплектующих, конфигуратор ПК и сравнение характеристик. Бесплатно и на русском."
    />
    <title>VOLTRIX — твой ПК, твои правила</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">К содержимому</a>
    <header class="header">
      <a class="logo" href="/" data-route
        ><span class="logo-mark">ϟ</span>VOLTRIX<span class="logo-dot"
          >●</span
        ></a
      >
      <nav class="desktop-nav" aria-label="Основное меню">
        <a href="/catalog" data-route>Каталог</a
        ><a href="/smart" data-route
          >Умный подбор <span class="tiny">0 ₽</span></a
        ><a href="/compare" data-route
          >Сравнение <span id="compare-count">0</span></a
        ><a href="/saved" data-route>Мои сборки</a
        ><a href="/about" data-route>О проекте</a>
      </nav>
      <a href="/configurator" data-route class="button small"
        >Собрать ПК <span>→</span></a
      ><button
        id="menu-button"
        class="icon-button mobile-menu"
        aria-label="Открыть меню"
        aria-expanded="false"
      >
        ☰
      </button>
    </header>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Мобильное меню" hidden>
      <a href="/" data-route>Главная</a><a href="/catalog" data-route>Каталог</a
      ><a href="/configurator" data-route>Конфигуратор</a
      ><a href="/smart" data-route>Умный подбор</a
      ><a href="/compare" data-route>Сравнение</a
      ><a href="/saved" data-route>Мои сборки</a
      ><a href="/about" data-route>О проекте</a>
    </nav>
    <main id="main" tabindex="-1">
      <div class="loading-screen">
        <span class="loader"></span>Загружаем комплектующие…
      </div>
    </main>
    <footer class="footer">
      <a class="logo" href="/" data-route
        ><span class="logo-mark">ϟ</span>VOLTRIX</a
      >
      <p>Больше мощности. Меньше сомнений.</p>
      <span>Расчётные цены · Проверяйте у продавца</span
      ><a href="/about" data-route>О проекте →</a>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-button" id="close-modal" aria-label="Закрыть окно">
          ✕
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <noscript
      ><p>
        Для конфигуратора и подбора включите JavaScript. Документация API
        доступна по адресу /docs.
      </p></noscript
    >
  </body>
</html>
