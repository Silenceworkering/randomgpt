[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dedlainych-ai"
version = "1.0.0"
description = "Учебный Telegram-помощник Дедлайныч"
requires-python = ">=3.12"
dependencies = [
 "aiogram>=3.22,<4", "aiohttp>=3.12,<4", "SQLAlchemy>=2.0.43,<2.1", "asyncpg>=0.30,<1",
 "alembic>=1.16,<2", "APScheduler>=3.11,<4", "pydantic-settings>=2.10,<3",
 "httpx>=0.28,<1", "Pillow>=11.3,<13", "pytesseract>=0.3.13,<0.4",
 "pypdf>=6,<7", "python-docx>=1.2,<2", "dateparser>=1.2,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "aiosqlite>=0.21,<1", "ruff>=0.13,<1", "build>=1.3,<2"]
[tool.setuptools.packages.find]
include = ["dedlainych*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
